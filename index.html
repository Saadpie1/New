<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inspire — Random Quote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f3e8ff; /* soft, light lavender background */
      --accent:#b40aFF; /* vivid purple accent */
      --accent-2:#7a4bd9; /* calmer purple for hover */
      --muted:#6b6b7a;
      --card-bg:rgba(255,255,255,0.85);
      --radius:18px;
      --glass-shadow: 0 6px 18px rgba(18,18,30,0.06);
      --max-width:820px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: linear-gradient(180deg,var(--bg),#ffffff 60%);
      color:#111;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:36px 20px;
    }

    .container{
      width:100%;
      max-width:var(--max-width);
      display:flex;
      flex-direction:column;
      gap:20px;
      align-items:center;
    }

    header{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logo{
      width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
      box-shadow:0 6px 18px rgba(180,10,255,0.15);
      display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:18px;
    }

    h1{font-size:18px;margin:0;font-weight:600;color:#2b2540}
    p.lead{margin:0;color:var(--muted);font-size:13px}

    main.card{
      width:100%;
      background:var(--card-bg);
      padding:28px;
      border-radius:var(--radius);
      box-shadow:var(--glass-shadow);
      display:flex;
      flex-direction:column;
      gap:18px;
      align-items:stretch;
    }

    .quote-wrap{
      display:flex;
      gap:16px;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      text-align:center;
      min-height:160px;
      padding:18px 12px;
    }

    blockquote{
      margin:0;
      font-size:20px;
      line-height:1.34;
      font-weight:500;
      color:#211a2a;
    }

    .author{
      margin-top:12px;
      font-size:14px;
      color:var(--muted);
      font-weight:600;
    }

    .controls{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
    }

    button.btn{
      border:0;cursor:pointer;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;
      display:inline-flex;gap:10px;align-items:center;justify-content:center;min-height:44px;
      transition:transform .12s ease,box-shadow .12s ease,background-color .12s ease;
    }

    .primary{
      background:linear-gradient(180deg,var(--accent),var(--accent-2));
      color:white;box-shadow:0 8px 30px rgba(124,63,217,0.18);
    }

    .primary:active{transform:translateY(1px)}
    .primary:hover{background:linear-gradient(180deg,var(--accent-2),var(--accent));}

    .share{
      background:transparent;border:1px solid rgba(33,26,42,0.06);padding:10px;border-radius:10px;min-width:48px;
    }

    .small{font-size:13px;padding:8px 12px;border-radius:10px}

    .status{font-size:13px;color:var(--muted);text-align:center}

    footer{width:100%;text-align:center;color:var(--muted);font-size:13px}

    /* Responsive tweaks */
    @media (max-width:560px){
      blockquote{font-size:18px}
      .card{padding:20px}
      header{flex-direction:column;align-items:flex-start}
      .controls{width:100%;}
    }
  </style>
</head>
<body>
  <div class="container" role="application">
    <header>
      <div class="brand">
        <div class="logo">IQ</div>
        <div>
          <h1>Inspire</h1>
          <p class="lead">A small single-file app for random inspirational quotes</p>
        </div>
      </div>
      <div aria-hidden="true" style="opacity:0.9;font-size:13px;color:var(--muted)">Powered by Quotable (with local fallback)</div>
    </header>

    <main class="card" aria-live="polite">
      <section class="quote-wrap" id="quoteWrap">
        <blockquote id="quoteText">Loading inspirational quote…</blockquote>
        <div class="author" id="quoteAuthor"></div>
      </section>

      <div class="controls">
        <button id="newQuoteBtn" class="btn primary" aria-label="Get a new quote">Get a New Quote</button>
        <button id="shareBtn" class="btn share" title="Share on X / Twitter" aria-label="Share quote">
          <!-- simple X/Twitter svg -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 5.92c-.63.28-1.3.47-2 .56.72-.43 1.28-1.1 1.54-1.9-.68.4-1.44.69-2.24.84A3.2 3.2 0 0015.5 4c-1.8 0-3.26 1.46-3.26 3.26 0 .26.03.51.08.75-2.71-.14-5.11-1.43-6.72-3.4-.28.48-.44 1.03-.44 1.62 0 1.12.57 2.11 1.43 2.69-.53-.02-1.03-.16-1.47-.4v.04c0 1.57 1.12 2.88 2.61 3.18-.27.08-.56.12-.86.12-.21 0-.41-.02-.61-.06.41 1.3 1.6 2.26 3.01 2.29A6.44 6.44 0 014 18.36a9.08 9.08 0 004.92 1.44c5.9 0 9.13-4.88 9.13-9.12v-.42c.62-.44 1.16-1 1.59-1.63-.57.25-1.18.42-1.8.5z" fill="currentColor"/>
          </svg>
        </button>
      </div>

      <div class="status" id="statusMsg" aria-live="polite"></div>
    </main>

    <footer>Built with ❤️ — <small>single-file</small></footer>
  </div>

  <script>
    // Modern, tiny single-file app that uses Quotable API with a local fallback.
    const QUOTABLE_URL = 'https://api.quotable.io/random';

    const el = {
      quoteText: document.getElementById('quoteText'),
      quoteAuthor: document.getElementById('quoteAuthor'),
      newQuoteBtn: document.getElementById('newQuoteBtn'),
      shareBtn: document.getElementById('shareBtn'),
      statusMsg: document.getElementById('statusMsg')
    };

    // Local fallback quotes in case the network/API fails or CORS blocks the request
    const localQuotes = [
      {content: "The only way to do great work is to love what you do.", author: "Steve Jobs"},
      {content: "It always seems impossible until it's done.", author: "Nelson Mandela"},
      {content: "You miss 100% of the shots you don't take.", author: "Wayne Gretzky"},
      {content: "Believe you can and you're halfway there.", author: "Theodore Roosevelt"},
      {content: "Start where you are. Use what you have. Do what you can.", author: "Arthur Ashe"},
      {content: "You are never too old to set another goal or to dream a new dream.", author: "C.S. Lewis"}
    ];

    // Utility: displays quote and author
    function displayQuote({content, author}){
      el.quoteText.textContent = '“' + content + '”';
      el.quoteAuthor.textContent = author ? ('— ' + author) : '— Unknown';
    }

    // Pick a random local quote
    function randomLocalQuote(){
      return localQuotes[Math.floor(Math.random()*localQuotes.length)];
    }

    // Fetch quote from Quotable API with timeout & error handling
    async function fetchQuote(){
      setLoading(true);
      el.statusMsg.textContent = '';
      try{
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);

        const res = await fetch(QUOTABLE_URL, {signal: controller.signal});
        clearTimeout(timeout);

        if(!res.ok) throw new Error('API error ' + res.status);
        const data = await res.json();
        // expected shape: { content, author }
        displayQuote({content: data.content, author: data.author});
        el.statusMsg.textContent = '';
      }catch(err){
        console.warn('Quote fetch failed:', err);
        // show a brief message and use a local fallback
        el.statusMsg.textContent = 'Using local fallback quote — unable to reach the API.';
        displayQuote(randomLocalQuote());
      }finally{
        setLoading(false);
      }
    }

    function setLoading(isLoading){
      if(isLoading){
        el.newQuoteBtn.disabled = true;
        el.newQuoteBtn.textContent = 'Loading...';
      } else {
        el.newQuoteBtn.disabled = false;
        el.newQuoteBtn.textContent = 'Get a New Quote';
      }
    }

    // Share the current quote on X/Twitter using intent URL
    function shareCurrentQuote(){
      const text = (el.quoteText.textContent || '') + ' ' + (el.quoteAuthor.textContent || '');
      const url = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text.trim());
      // open in a small window
      window.open(url, '_blank', 'noopener');
    }

    // Initialize
    el.newQuoteBtn.addEventListener('click', fetchQuote);
    el.shareBtn.addEventListener('click', shareCurrentQuote);

    // Fetch one on load
    (async ()=>{
      // slight delay for polish
      await new Promise(r => setTimeout(r, 200));
      fetchQuote();
    })();

    // Accessibility: allow keyboard Enter on focused newQuoteBtn
    el.newQuoteBtn.addEventListener('keyup', (e)=>{ if(e.key === 'Enter') fetchQuote(); });

  </script>
</body>
</html>
