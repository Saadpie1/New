<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inspirator</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3e8ff;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    blockquote {
      font-size: 22px;
      font-weight: 500;
      margin: 0;
    }
    .author {
      margin-top: 15px;
      font-size: 15px;
      color: #555;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .primary {
      background: #b40aFF;
      color: #fff;
    }
    .primary:hover {
      background: #7a4bd9;
    }
    .share {
      background: #eee;
      color: #333;
    }
    @media (max-width: 600px) {
      blockquote { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <blockquote id="quoteText">Loading quote…</blockquote>
    <div class="author" id="quoteAuthor"></div>
    <div class="controls">
      <button id="newQuoteBtn" class="btn primary">Get a New Quote</button>
      <button id="shareBtn" class="btn share">Share on X</button>
    </div>
  </div>

  <script>
    let quotes = [];
    const quoteText = document.getElementById("quoteText");
    const quoteAuthor = document.getElementById("quoteAuthor");
    const newQuoteBtn = document.getElementById("newQuoteBtn");
    const shareBtn = document.getElementById("shareBtn");

    async function loadQuotes() {
      try {
        const res = await fetch("./quotes.json");
        if (!res.ok) throw new Error("Failed to load quotes.json");
        quotes = await res.json();
        showRandomQuote();
      } catch (e) {
        console.error(e);
        // fallback list if quotes.json is missing
        quotes = [
          { content: "Stay hungry, stay foolish.", author: "Steve Jobs" },
          { content: "The best way to predict the future is to invent it.", author: "Alan Kay" },
          { content: "Simplicity is the ultimate sophistication.", author: "Leonardo da Vinci" }
        ];
        showRandomQuote();
      }
    }

    function showRandomQuote() {
      if (!quotes.length) return;
      const q = quotes[Math.floor(Math.random() * quotes.length)];
      quoteText.textContent = "“" + q.content + "”";
      quoteAuthor.textContent = q.author ? "— " + q.author : "— Unknown";
    }

    function shareQuote() {
      const text = (quoteText.textContent || '') + ' ' + (quoteAuthor.textContent || '');
      const url = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text.trim());
      window.open(url, "_blank");
    }

    newQuoteBtn.addEventListener("click", showRandomQuote);
    shareBtn.addEventListener("click", shareQuote);

    loadQuotes();
  </script>
</body>
</html>
